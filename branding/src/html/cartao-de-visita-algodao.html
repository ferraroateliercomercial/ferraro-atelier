<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>cartao-de-visita-algodao</title><link href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,100..900&display=swap" rel="stylesheet">
<style>@page{size:96.0mm 56.0mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#888}
body{font-family:Saira,sans-serif;color:#2a2119;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{position:relative;overflow:hidden;break-after:page;background:#ebe5d4}
.page:last-child{break-after:auto}
.trim{position:absolute;left:3.0mm;top:3.0mm}
.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.track{position:absolute;left:0;top:0;overflow:visible}
.abs{position:absolute}
.label{font-weight:500;font-stretch:125%;text-transform:uppercase;letter-spacing:.2em;font-size:5.6pt;color:#5f5244}
.display{font-weight:300;font-stretch:112%;letter-spacing:-.01em;line-height:1.08}
.print{color:#efe6cf}
.rule{display:block}
img{display:block}
.page{width:96.0mm;height:56.0mm}
.mark{position:absolute;left:50%;top:50%;translate:-50% -50%}
.back-in{position:absolute;inset:7mm 7.5mm}
.tag{font-weight:500;font-stretch:125%;text-transform:uppercase;letter-spacing:.32em;font-size:5.2pt}
.ct{position:absolute;left:0;bottom:0;display:grid;gap:1.1mm;font-size:7.4pt;letter-spacing:.02em;font-stretch:104%}
.ct span{display:inline-block;width:17.5mm;font-weight:500;font-stretch:125%;text-transform:uppercase;letter-spacing:.22em;font-size:4.8pt;opacity:.72}
.wg{position:absolute;right:0;top:0;width:8mm}
.hair{position:absolute;left:0;right:0;top:50%;height:0;border-top:.12mm solid currentColor;opacity:.22}
</style></head>
<body><section class="page"><img class="full" src="../img/cartao-algodao-verde.jpg"><div class="trim" style="width:90mm;height:50mm"><img class="mark" src="../img/empilhada-marfim.svg" style="width:21mm"></div></section><section class="page"><img class="full" src="../img/cartao-algodao-claro.jpg"><div class="trim" style="width:90mm;height:50mm"><div class="back-in" style="color:#2a2119">
      <p class="tag">Relojoaria sob encomenda</p>
      <img class="wg" src="../img/asas-ouro.svg">
      <div class="ct"><p><span>WhatsApp</span>(48) 99695-0800</p><p><span>Instagram</span>@ferraro_atelier</p></div>
    </div></div></section></body></html>
